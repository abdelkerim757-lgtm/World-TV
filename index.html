<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Hamouda TV 📺</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#08090d;
  color:#fff;
  font-family:Arial,Tahoma,sans-serif;
}

body{
  min-height:100vh;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(8,9,13,.94);
  backdrop-filter:blur(15px);
  border-bottom:1px solid #252833;
}

.nav{
  max-width:1400px;
  margin:auto;
  height:65px;
  display:flex;
  align-items:center;
  gap:25px;
  padding:0 20px;
}

.brand{
  font-size:24px;
  font-weight:900;
  white-space:nowrap;
}

.brand span{
  color:#e50914;
}

.nav-title{
  color:#aaa;
  font-size:14px;
}

.search{
  margin-right:auto;
  width:min(320px,40vw);
}

.search input{
  width:100%;
  padding:11px 15px;
  border-radius:25px;
  border:1px solid #30333c;
  background:#171920;
  color:#fff;
  outline:none;
}

/* HERO PLAYER */

.hero{
  width:100%;
  background:#000;
}

.player-wrap{
  max-width:1400px;
  margin:auto;
  position:relative;
  aspect-ratio:16/9;
  max-height:70vh;
  overflow:hidden;
  background:#000;
}

video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

.player-info{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:50px 25px 20px;
  background:linear-gradient(
    transparent,
    rgba(0,0,0,.9)
  );
  pointer-events:none;
}

.live{
  display:inline-block;
  background:#e50914;
  padding:5px 9px;
  border-radius:5px;
  font-size:12px;
  font-weight:bold;
}

.channel-title{
  font-size:25px;
  font-weight:bold;
  margin-top:8px;
}

.player-buttons{
  position:absolute;
  left:20px;
  bottom:20px;
  display:flex;
  gap:8px;
}

.player-btn{
  border:0;
  background:#ffffff18;
  color:white;
  border:1px solid #ffffff30;
  border-radius:8px;
  padding:9px 14px;
  cursor:pointer;
}

/* CONTENT */

.content{
  max-width:1400px;
  margin:auto;
  padding:25px 20px 60px;
}

.section{
  margin-top:28px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.section-title{
  font-size:21px;
  font-weight:bold;
}

.section-count{
  color:#777;
  font-size:13px;
}

/* COUNTRY */

.country-row{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:8px;
  scrollbar-width:none;
}

.country-row::-webkit-scrollbar{
  display:none;
}

.country-btn{
  flex:0 0 auto;
  border:1px solid #30343d;
  background:#171920;
  color:#ddd;
  padding:10px 15px;
  border-radius:22px;
  cursor:pointer;
}

.country-btn.active{
  background:#e50914;
  border-color:#e50914;
  color:#fff;
}

/* CHANNEL GRID */

.channel-grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(180px,1fr));
  gap:14px;
}

.card{
  background:#14161d;
  border:1px solid #252934;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:scale(1.025);
  border-color:#444955;
}

.card-logo{
  height:110px;
  background:#0d0f14;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.card-logo img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.fallback{
  font-size:38px;
}

.card-body{
  padding:11px;
}

.card-name{
  font-size:15px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card-country{
  color:#777f8d;
  font-size:12px;
  margin-top:5px;
}

.watch{
  margin-top:9px;
  width:100%;
  border:0;
  border-radius:7px;
  padding:9px;
  background:#262a33;
  color:#fff;
  cursor:pointer;
}

.watch:hover{
  background:#e50914;
}

/* LOADING */

.loading{
  text-align:center;
  padding:50px;
  color:#8b919d;
}

.error{
  text-align:center;
  padding:40px;
  color:#ff7777;
}

/* FOOTER */

footer{
  text-align:center;
  padding:30px;
  color:#555c68;
  font-size:12px;
}

/* LANDSCAPE */

@media (orientation:landscape) and (max-height:600px){

  .nav{
    height:52px;
  }

  .player-wrap{
    max-height:calc(100vh - 52px);
    aspect-ratio:auto;
    height:calc(100vh - 52px);
  }

  .content{
    padding-top:18px;
  }

  .channel-grid{
    grid-template-columns:
      repeat(auto-fill,minmax(160px,1fr));
  }
}

/* MOBILE */

@media(max-width:650px){

  .nav{
    height:58px;
    padding:0 12px;
    gap:10px;
  }

  .brand{
    font-size:20px;
  }

  .nav-title{
    display:none;
  }

  .search{
    width:auto;
    max-width:180px;
  }

  .search input{
    padding:9px 12px;
  }

  .player-info{
    padding:35px 14px 12px;
  }

  .channel-title{
    font-size:18px;
  }

  .player-buttons{
    left:10px;
    bottom:10px;
  }

  .content{
    padding:18px 12px 40px;
  }

  .channel-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
    gap:9px;
  }

  .card-logo{
    height:90px;
  }

  .card-body{
    padding:9px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <div class="brand">
      <span>HAMOUDA</span> TV 📺
    </div>

    <div class="nav-title">
      عالم القنوات بين يديك
    </div>

    <div class="search">
      <input
        id="search"
        type="search"
        placeholder="🔎 ابحث عن قناة..."
      >
    </div>

  </div>
</header>


<section class="hero">

  <div class="player-wrap">

    <video
      id="player"
      autoplay
      muted
      playsinline
      controls
    ></video>

    <div class="player-info">

      <div class="live">
        ● LIVE
      </div>

      <div
        class="channel-title"
        id="nowPlaying"
      >
        جاري اختيار قناة...
      </div>

    </div>

    <div class="player-buttons">

      <button
        class="player-btn"
        onclick="toggleSound()"
      >
        🔊 الصوت
      </button>

    </div>

  </div>

</section>


<main class="content">

  <div
    id="status"
    class="loading"
  >
    ⏳ جاري تحميل القنوات...
  </div>


  <section class="section">

    <div class="section-head">
      <div class="section-title">
        🌍 الدول
      </div>
    </div>

    <div
      id="countries"
      class="country-row"
    ></div>

  </section>


  <section class="section">

    <div class="section-head">

      <div class="section-title">
        📺 القنوات
      </div>

      <div
        id="count"
        class="section-count"
      ></div>

    </div>

    <div
      id="channels"
      class="channel-grid"
    ></div>

  </section>

</main>


<footer>
  HAMOUDA TV 📺
  <br>
  World Television
</footer>


<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>

const CHANNELS_URL =
"https://iptv-org.github.io/api/channels.json";

const STREAMS_URL =
"https://iptv-org.github.io/api/streams.json";

let channels=[];
let streams=[];
let streamMap=new Map();

let currentCountry="";
let currentChannels=[];

const video=
document.getElementById("player");


async function init(){

  try{

    const responses=await Promise.all([

      fetch(CHANNELS_URL),
      fetch(STREAMS_URL)

    ]);

    if(
      !responses[0].ok ||
      !responses[1].ok
    ){
      throw new Error();
    }

    channels=
      await responses[0].json();

    streams=
      await responses[1].json();


    streams.forEach(stream=>{

      if(
        stream.channel &&
        stream.url &&
        !streamMap.has(stream.channel)
      ){

        streamMap.set(
          stream.channel,
          stream.url
        );

      }

    });


    currentChannels=
      channels.filter(c=>
        streamMap.has(c.id)
      );


    createCountries();

    showChannels();

    /*
      تشغيل أول قناة تلقائياً
    */

    if(currentChannels.length){

      playChannel(
        currentChannels[0]
      );

    }


    document.getElementById(
      "status"
    ).style.display="none";


  }catch(error){

    console.error(error);

    document.getElementById(
      "status"
    ).innerHTML=
      "❌ تعذر تحميل القنوات.<br>تحقق من الإنترنت.";

  }

}


function createCountries(){

  const box=
    document.getElementById(
      "countries"
    );

  box.innerHTML="";


  const countries=
    new Set();


  currentChannels.forEach(channel=>{

    if(
      Array.isArray(channel.countries)
    ){

      channel.countries.forEach(
        country=>{
          countries.add(country);
        }
      );

    }

  });


  const all=
    document.createElement("button");

  all.className=
    "country-btn active";

  all.textContent=
    "🌍 الكل";

  all.onclick=()=>{

    currentCountry="";

    document
      .querySelectorAll(".country-btn")
      .forEach(b=>
        b.classList.remove("active")
      );

    all.classList.add("active");

    showChannels();

  };

  box.appendChild(all);


  Array.from(countries)
    .sort((a,b)=>
      a.localeCompare(b)
    )
    .forEach(country=>{

      const button=
        document.createElement("button");

      button.className=
        "country-btn";

      button.textContent=
        "🌐 " + country;

      button.onclick=()=>{

        currentCountry=
          country;

        document
          .querySelectorAll(
            ".country-btn"
          )
          .forEach(b=>
            b.classList.remove(
              "active"
            )
          );

        button.classList.add(
          "active"
        );

        showChannels();

      };

      box.appendChild(button);

    });

}


function showChannels(){

  const search=
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  let list=
    currentChannels.filter(channel=>{

      const name=
        (channel.name || "")
        .toLowerCase();


      const countryOK=
        !currentCountry ||
        (
          Array.isArray(
            channel.countries
          ) &&
          channel.countries.includes(
            currentCountry
          )
        );


      const searchOK=
        !search ||
        name.includes(search);


      return countryOK &&
             searchOK;

    });


  list.sort((a,b)=>
    (a.name||"")
    .localeCompare(
      b.name||""
    )
  );


  const box=
    document.getElementById(
      "channels"
    );

  box.innerHTML="";


  document.getElementById(
    "count"
  ).textContent=
    list.length +
    " قناة";


  list.forEach(channel=>{

    const card=
      document.createElement(
        "div"
      );

    card.className="card";


    const logo=
      document.createElement(
        "div"
      );

    logo.className=
      "card-logo";


    if(channel.logo){

      const img=
        document.createElement(
          "img"
        );

      img.src=channel.logo;

      img.alt=
        channel.name || "";

      img.loading="lazy";

      img.onerror=()=>{

        img.remove();

        logo.innerHTML=
          '<div class="fallback">📺</div>';

      };

      logo.appendChild(img);

    }else{

      logo.innerHTML=
        '<div class="fallback">📺</div>';

    }


    card.appendChild(logo);


    const body=
      document.createElement(
        "div"
      );

    body.className=
      "card-body";


    const name=
      document.createElement(
        "div"
      );

    name.className=
      "card-name";

    name.textContent=
      channel.name ||
      "قناة";

    body.appendChild(name);


    const country=
      document.createElement(
        "div"
      );

    country.className=
      "card-country";

    country.textContent=
      (
        channel.countries &&
        channel.countries[0]
      ) ||
      "International";

    body.appendChild(country);


    const button=
      document.createElement(
        "button"
      );

    button.className="watch";

    button.textContent=
      "▶ مشاهدة الآن";

    button.onclick=()=>{

      playChannel(channel);

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    };


    body.appendChild(button);

    card.appendChild(body);

    box.appendChild(card);

  });


}


function playChannel(channel){

  const url=
    streamMap.get(channel.id);

  if(!url){
    return;
  }


  document.getElementById(
    "nowPlaying"
  ).textContent=
    channel.name ||
    "Live TV";


  /*
    HLS
  */

  if(
    window.Hls &&
    Hls.isSupported() &&
    (
      url.includes(".m3u8") ||
      url.includes("m3u8")
    )
  ){

    if(window.currentHls){
      window.currentHls.destroy();
    }


    const hls=
      new Hls();

    window.currentHls=
      hls;


    hls.loadSource(url);

    hls.attachMedia(video);

    hls.on(
      Hls.Events.MANIFEST_PARSED,
      ()=>{
        video.play().catch(()=>{});
      }
    );


  }else{

    video.src=url;

    video.play().catch(()=>{});

  }

}


function toggleSound(){

  video.muted=
    !video.muted;

  if(!video.muted){

    video.volume=1;

  }

}


document
  .getElementById("search")
  .addEventListener(
    "input",
    showChannels
  );


init();

</script>

</body>
    </html>
