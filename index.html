<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAMOUDA TV PRO</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#07090d;color:#fff;
 font-family:Arial,Tahoma,sans-serif
}
header{
 position:sticky;top:0;z-index:20;
 background:#0d1016ee;
 backdrop-filter:blur(12px);
 border-bottom:1px solid #242933
}
.nav{
 max-width:1400px;margin:auto;
 min-height:65px;padding:10px 15px;
 display:flex;align-items:center;gap:15px
}
.logo{font-size:21px;font-weight:bold;white-space:nowrap}
.logo b{color:#e50914}
.search{margin-right:auto;width:330px}
.search input{
 width:100%;padding:11px 16px;
 border-radius:25px;border:1px solid #303641;
 background:#171a20;color:#fff;outline:none
}

.player{
 position:relative;background:#000;
 width:100%;max-width:1400px;margin:auto;
 aspect-ratio:16/9
}
video{
 width:100%;height:100%;
 background:#000;object-fit:contain
}
.playerTop{
 position:absolute;top:0;right:0;left:0;
 padding:15px;
 background:linear-gradient(#000b,transparent);
 pointer-events:none
}
.live{
 background:#e50914;
 padding:5px 9px;border-radius:5px;
 font-size:12px
}
.channelName{
 margin-top:8px;font-weight:bold;font-size:18px
}
.loader,.error{
 position:absolute;inset:0;
 display:none;align-items:center;
 justify-content:center;
 flex-direction:column;
 gap:13px;background:#000c;
 z-index:5
}
.spinner{
 width:40px;height:40px;
 border:4px solid #444;
 border-top-color:#e50914;
 border-radius:50%;
 animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.error button{
 background:#e50914;color:#fff;
 border:0;border-radius:8px;
 padding:11px 20px;font-size:15px
}

main{
 max-width:1400px;margin:auto;
 padding:18px 15px 50px
}
.title{
 font-size:20px;font-weight:bold;
 margin:22px 0 12px
}
.row{
 display:flex;gap:8px;
 overflow-x:auto;padding-bottom:7px;
 scrollbar-width:none
}
.row::-webkit-scrollbar{display:none}
.btn{
 flex:0 0 auto;
 background:#171a20;color:#ddd;
 border:1px solid #303641;
 padding:10px 15px;
 border-radius:22px;cursor:pointer
}
.btn.active{
 background:#e50914;
 border-color:#e50914;color:white
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
 gap:13px
}
.card{
 background:#14171d;
 border:1px solid #252a34;
 border-radius:11px;
 overflow:hidden
}
.logoBox{
 height:105px;background:#0c0f14;
 display:flex;align-items:center;
 justify-content:center;position:relative
}
.logoBox img{
 width:100%;height:100%;
 object-fit:contain;padding:12px
}
.flag{
 position:absolute;right:7px;top:7px;
 font-size:22px;z-index:2
}
.fallback{font-size:40px}
.info{padding:10px}
.name{
 font-weight:bold;font-size:14px;
 white-space:nowrap;overflow:hidden;
 text-overflow:ellipsis
}
.country{
 color:#89919e;font-size:12px;margin-top:6px
}
.watch{
 width:100%;margin-top:9px;
 border:0;border-radius:7px;
 padding:9px;background:#292e38;
 color:#fff;cursor:pointer
}
.watch:hover{background:#e50914}
.more{
 display:block;margin:25px auto;
 background:#181c23;color:#fff;
 border:1px solid #343b46;
 padding:12px 25px;border-radius:25px
}
.status{text-align:center;color:#89919e;padding:30px}

@media(max-width:650px){
 .logo{font-size:17px}
 .search{width:150px}
 .grid{
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px
 }
 .logoBox{height:90px}
}

@media(orientation:landscape) and (max-height:600px){
 .player{
  height:100vh;
  aspect-ratio:auto
 }
}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="logo"><b>HAMOUDA</b> TV PRO 📺</div>
<div class="search">
<input id="search" placeholder="🔎 ابحث عن قناة">
</div>
</div>
</header>

<div class="player">

<video id="video" controls playsinline preload="none"></video>

<div class="playerTop">
<span class="live">🔴 LIVE</span>
<div id="channelName" class="channelName">
اختر قناة للمشاهدة
</div>
</div>

<div id="loader" class="loader">
<div class="spinner"></div>
<div>جاري الاتصال بالبث...</div>
</div>

<div id="error" class="error">
<div id="errorText">تعذر تشغيل القناة</div>
<button onclick="retry()">🔄 إعادة المحاولة</button>
</div>

</div>

<main>

<div class="title">🌍 التصنيفات</div>
<div id="categories" class="row"></div>

<div class="title">🌐 البلدان</div>
<div id="countries" class="row"></div>

<div id="status" class="status">
⏳ جاري تحميل القنوات...
</div>

<div id="grid" class="grid"></div>

<button id="more" class="more" style="display:none">
عرض 50 قناة أخرى
</button>

</main>

<script>

const CHANNELS=
"https://iptv-org.github.io/api/channels.json";

const STREAMS=
"https://iptv-org.github.io/api/streams.json";

const BATCH=50;

let channels=[];
let streams=new Map();
let filtered=[];
let shown=0;
let category="all";
let country="all";
let current=null;
let hls=null;
let retryTimer=null;


/* الدول */

const C={
DZ:["🇩🇿","الجزائر"],
MA:["🇲🇦","المغرب"],
TN:["🇹🇳","تونس"],
EG:["🇪🇬","مصر"],
LY:["🇱🇾","ليبيا"],
SA:["🇸🇦","السعودية"],
AE:["🇦🇪","الإمارات"],
QA:["🇶🇦","قطر"],
KW:["🇰🇼","الكويت"],
JO:["🇯🇴","الأردن"],
LB:["🇱🇧","لبنان"],
IQ:["🇮🇶","العراق"],
PS:["🇵🇸","فلسطين"],
FR:["🇫🇷","فرنسا"],
GB:["🇬🇧","بريطانيا"],
DE:["🇩🇪","ألمانيا"],
IT:["🇮🇹","إيطاليا"],
ES:["🇪🇸","إسبانيا"],
PT:["🇵🇹","البرتغال"],
NL:["🇳🇱","هولندا"],
BE:["🇧🇪","بلجيكا"],
CH:["🇨🇭","سويسرا"],
SE:["🇸🇪","السويد"],
NO:["🇳🇴","النرويج"],
DK:["🇩🇰","الدنمارك"],
FI:["🇫🇮","فنلندا"],
GR:["🇬🇷","اليونان"],
TR:["🇹🇷","تركيا"],
RU:["🇷🇺","روسيا"],
US:["🇺🇸","أمريكا"],
CA:["🇨🇦","كندا"],
MX:["🇲🇽","المكسيك"],
BR:["🇧🇷","البرازيل"],
AR:["🇦🇷","الأرجنتين"],
CL:["🇨🇱","تشيلي"],
CO:["🇨🇴","كولومبيا"],
IN:["🇮🇳","الهند"],
JP:["🇯🇵","اليابان"],
KR:["🇰🇷","كوريا"],
CN:["🇨🇳","الصين"],
ID:["🇮🇩","إندونيسيا"],
MY:["🇲🇾","ماليزيا"],
TH:["🇹🇭","تايلاند"],
PH:["🇵🇭","الفلبين"],
AU:["🇦🇺","أستراليا"],
NZ:["🇳🇿","نيوزيلندا"],
ZA:["🇿🇦","جنوب أفريقيا"],
NG:["🇳🇬","نيجيريا"]
};

const ARAB=[
"DZ","MA","TN","EG","LY","SA","AE",
"QA","KW","JO","LB","IQ","PS"
];

const EUROPE=[
"FR","GB","DE","IT","ES","PT","NL",
"BE","CH","SE","NO","DK","FI","GR",
"TR","RU"
];

const AMERICA=[
"US","CA","MX","BR","AR","CL","CO"
];

const ASIA=[
"IN","JP","KR","CN","ID","MY","TH","PH"
];


/* تحميل */

async function load(){

try{

const [a,b]=await Promise.all([
fetch(CHANNELS),
fetch(STREAMS)
]);

const cd=await a.json();
const sd=await b.json();

sd.forEach(x=>{
 if(x.channel && x.url && !streams.has(x.channel)){
  streams.set(x.channel,x.url);
 }
});

channels=cd.filter(x=>streams.has(x.id));

buildCategories();
buildCountries();
apply();

document.getElementById("status").style.display="none";

}catch(e){

document.getElementById("status").innerHTML=
"❌ تعذر تحميل القنوات. تحقق من الإنترنت.";

}

}


/* التصنيفات */

function buildCategories(){

const box=document.getElementById("categories");

[
["all","🌍 العالم"],
["arab","🕌 العربية"],
["europe","🇪🇺 أوروبا"],
["america","🌎 أمريكا"],
["asia","🌏 آسيا"]
].forEach(x=>{

const b=document.createElement("button");
b.className="btn"+(x[0]=="all"?" active":"");
b.textContent=x[1];

b.onclick=()=>{

category=x[0];

box.querySelectorAll(".btn")
.forEach(z=>z.classList.remove("active"));

b.classList.add("active");

apply();

};

box.appendChild(b);

});

}


/* البلدان */

function buildCountries(){

const box=document.getElementById("countries");

const all=document.createElement("button");

all.className="btn active";
all.textContent="🌍 كل البلدان";

all.onclick=()=>{
 country="all";
 box.querySelectorAll(".btn")
 .forEach(x=>x.classList.remove("active"));
 all.classList.add("active");
 apply();
};

box.appendChild(all);

const found=new Set();

channels.forEach(x=>{
 if(x.country) found.add(x.country);
});

[...found].sort().forEach(code=>{

const b=document.createElement("button");
b.className="btn";

b.textContent=
C[code] ? C[code][0]+" "+C[code][1] : "🌐 "+code;

b.onclick=()=>{

country=code;

box.querySelectorAll(".btn")
.forEach(x=>x.classList.remove("active"));

b.classList.add("active");

apply();

};

box.appendChild(b);

});

}


/* فلترة */

function apply(){

const q=document.getElementById("search")
.value.toLowerCase().trim();

filtered=channels.filter(x=>{

if(q && !(x.name||"").toLowerCase().includes(q))
return false;

if(country!="all" && x.country!=country)
return false;

if(category=="arab" && !ARAB.includes(x.country))
return false;

if(category=="europe" && !EUROPE.includes(x.country))
return false;

if(category=="america" && !AMERICA.includes(x.country))
return false;

if(category=="asia" && !ASIA.includes(x.country))
return false;

return true;

});

filtered.sort((a,b)=>
(a.name||"").localeCompare(b.name||"")
);

shown=0;
document.getElementById("grid").innerHTML="";

render();

}


/* 50 قناة */

function render(){

const grid=document.getElementById("grid");

const end=Math.min(shown+BATCH,filtered.length);

for(let i=shown;i<end;i++){
 createCard(filtered[i],grid);
}

shown=end;

document.getElementById("more").style.display=
shown<filtered.length ? "block":"none";

}


/* البطاقة */

function createCard(x,grid){

const card=document.createElement("div");
card.className="card";

const logo=document.createElement("div");
logo.className="logoBox";

const flag=document.createElement("div");
flag.className="flag";
flag.textContent=C[x.country]
?C[x.country][0]:"🌐";

logo.appendChild(flag);

if(x.logo){

const img=document.createElement("img");

img.src=x.logo;
img.alt=x.name||"";
img.loading="lazy";

img.onerror=()=>{
 img.remove();
 const f=document.createElement("div");
 f.className="fallback";
 f.textContent="📺";
 logo.appendChild(f);
};

logo.appendChild(img);

}else{

const f=document.createElement("div");
f.className="fallback";
f.textContent="📺";
logo.appendChild(f);

}

card.appendChild(logo);

const info=document.createElement("div");
info.className="info";

const name=document.createElement("div");
name.className="name";
name.textContent=x.name||"قناة";

const co=document.createElement("div");
co.className="country";
co.textContent=C[x.country]
?C[x.country][0]+" "+C[x.country][1]
:"🌐 دولية";

const btn=document.createElement("button");
btn.className="watch";
btn.textContent="▶ مشاهدة الآن";

btn.onclick=()=>play(x);

info.appendChild(name);
info.appendChild(co);
info.appendChild(btn);

card.appendChild(info);
grid.appendChild(card);

}


/* المشغل */

function play(channel){

const url=streams.get(channel.id);

if(!url){

error("لا يوجد رابط بث للقناة");
return;

}

current=channel;

document.getElementById("channelName")
.textContent=channel.name||"Live TV";

start(url);

}


function start(url){

clearTimeout(retryTimer);

hideError();
showLoader();

if(hls){

hls.destroy();
hls=null;

}

video.pause();
video.removeAttribute("src");
video.load();


if(
window.Hls &&
Hls.isSupported() &&
/\.m3u8/i.test(url)
){

hls=new Hls({

enableWorker:true,

maxBufferLength:20,
maxMaxBufferLength:40,

manifestLoadingTimeOut:10000,
manifestLoadingMaxRetry:2,

levelLoadingMaxRetry:2,
fragLoadingMaxRetry:2

});

hls.loadSource(url);
hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED,()=>{

hideLoader();

video.play().catch(()=>{});

});

hls.on(Hls.Events.ERROR,(e,d)=>{

if(!d.fatal)return;

if(
d.type===Hls.ErrorTypes.MEDIA_ERROR
){

hls.recoverMediaError();
return;

}

if(
d.type===Hls.ErrorTypes.NETWORK_ERROR
){

retryTimer=setTimeout(()=>{

if(current){

const u=streams.get(current.id);

if(u)start(u);

}

},3000);

return;

}

error("هذا البث غير متاح داخل المتصفح");

});

}else{

video.src=url;

video.load();

video.play()
.then(()=>hideLoader())
.catch(()=>{

hideLoader();

error("اضغط ▶ لتشغيل القناة");

});

}

}


function showLoader(){

document.getElementById("loader")
.style.display="flex";

}

function hideLoader(){

document.getElementById("loader")
.style.display="none";

}

function error(text){

hideLoader();

document.getElementById("errorText")
.textContent="⚠️ "+text;

document.getElementById("error")
.style.display="flex";

}

function hideError(){

document.getElementById("error")
.style.display="none";

}

function retry(){

if(!current)return;

const url=streams.get(current.id);

if(url)start(url);

}


document.getElementById("more")
.onclick=render;

document.getElementById("search")
.oninput=apply;

load();

</script>

</body>
  </html>
