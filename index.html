<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HAMOUDA TV PRO</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
background:#07090d;
color:#fff;
font-family:Arial,Tahoma,sans-serif
}

body{min-height:100vh}

header{
position:sticky;
top:0;
z-index:30;
background:#0c0f14ee;
backdrop-filter:blur(12px);
border-bottom:1px solid #252a33
}

.nav{
max-width:1450px;
margin:auto;
min-height:64px;
display:flex;
align-items:center;
gap:12px;
padding:9px 14px
}

.logo{
font-size:20px;
font-weight:900;
white-space:nowrap
}

.logo b{color:#e50914}

.search{
margin-right:auto;
width:min(330px,45vw)
}

.search input{
width:100%;
padding:11px 15px;
border-radius:25px;
border:1px solid #303641;
background:#171a20;
color:white;
outline:none
}

/* PLAYER */

#playerPage{
display:none;
background:#000;
min-height:calc(100vh - 64px)
}

.player{
position:relative;
width:100%;
max-width:1450px;
margin:auto;
background:#000;
aspect-ratio:16/9
}

video{
width:100%;
height:100%;
display:block;
background:#000;
object-fit:contain
}

.playerTop{
position:absolute;
top:0;
right:0;
left:0;
z-index:5;
padding:14px;
display:flex;
align-items:center;
gap:10px;
background:linear-gradient(#000c,transparent);
pointer-events:none
}

.live{
background:#e50914;
padding:5px 9px;
border-radius:5px;
font-size:11px
}

.channelName{
font-weight:bold;
font-size:17px
}

.playerMessage{
position:absolute;
inset:0;
z-index:8;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
gap:14px;
background:#000c;
text-align:center
}

.spinner{
width:40px;
height:40px;
border:4px solid #444;
border-top-color:#e50914;
border-radius:50%;
animation:spin .8s linear infinite
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.playerMessage button{
border:0;
background:#e50914;
color:#fff;
padding:11px 20px;
border-radius:8px;
font-size:15px
}

/* PLAYER BUTTONS */

.playerControls{
max-width:1450px;
margin:auto;
background:#0d1015;
padding:10px;
display:flex;
gap:8px;
justify-content:center
}

.pbtn{
border:1px solid #303641;
background:#181c23;
color:#fff;
padding:10px 15px;
border-radius:8px;
cursor:pointer
}

.pbtn:hover{
background:#e50914
}

.homeBtn{
background:#e50914;
border-color:#e50914
}

/* MAIN */

main{
max-width:1450px;
margin:auto;
padding:18px 14px 50px
}

.sectionTitle{
font-size:21px;
font-weight:bold;
margin:12px 0
}

.countries{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:10px
}

.countryCard{
background:#14171d;
border:1px solid #292e38;
border-radius:10px;
padding:16px 10px;
color:#fff;
cursor:pointer;
text-align:center
}

.countryCard:hover{
border-color:#e50914;
transform:translateY(-2px)
}

.countryFlag{
font-size:34px
}

.countryName{
margin-top:7px;
font-weight:bold
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:13px
}

.card{
background:#14171d;
border:1px solid #252a34;
border-radius:11px;
overflow:hidden
}

.logoBox{
height:105px;
background:#0c0f14;
display:flex;
align-items:center;
justify-content:center;
position:relative
}

.logoBox img{
width:100%;
height:100%;
object-fit:contain;
padding:12px
}

.flag{
position:absolute;
top:7px;
right:7px;
font-size:22px;
z-index:2
}

.fallback{
font-size:40px
}

.info{
padding:10px
}

.name{
font-weight:bold;
font-size:14px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.country{
color:#89919e;
font-size:12px;
margin-top:6px
}

.watch{
width:100%;
margin-top:9px;
border:0;
border-radius:7px;
padding:9px;
background:#292e38;
color:#fff;
cursor:pointer
}

.watch:hover{
background:#e50914
}

.backCountries{
margin-bottom:15px;
border:1px solid #303641;
background:#181c23;
color:#fff;
padding:10px 16px;
border-radius:8px
}

.more{
display:block;
margin:25px auto;
background:#181c23;
color:#fff;
border:1px solid #343b46;
padding:12px 25px;
border-radius:25px
}

.status{
text-align:center;
color:#89919e;
padding:30px
}

/* LANDSCAPE */

@media(orientation:landscape) and (max-height:650px){

.player{
height:calc(100vh - 55px);
aspect-ratio:auto
}

#playerPage{
min-height:100vh
}

.playerControls{
position:relative
}

}

/* MOBILE */

@media(max-width:650px){

.logo{
font-size:17px
}

.search{
width:150px
}

.countries{
grid-template-columns:repeat(3,1fr)
}

.countryCard{
padding:12px 5px
}

.countryFlag{
font-size:28px
}

.grid{
grid-template-columns:repeat(2,minmax(0,1fr));
gap:9px
}

.logoBox{
height:90px
}

}

/* LANDSCAPE MOBILE */

@media(max-width:900px) and (orientation:landscape){

header{
display:none
}

.player{
height:100vh;
aspect-ratio:auto
}

.playerControls{
position:fixed;
bottom:0;
left:0;
right:0;
z-index:20;
opacity:.96
}

.pbtn{
padding:8px 12px
}

}
</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo">
<b>HAMOUDA</b> TV PRO 📺
</div>

<div class="search">
<input id="search" placeholder="🔎 ابحث عن قناة">
</div>

</div>
</header>


<!-- PLAYER -->

<section id="playerPage">

<div class="player">

<video
id="video"
controls
playsinline
preload="none">
</video>

<div class="playerTop">

<span class="live">🔴 LIVE</span>

<div id="channelName" class="channelName">
جاري التشغيل...
</div>

</div>


<div id="message" class="playerMessage">

<div id="messageText">
جاري الاتصال بالبث...
</div>

<div id="spinner" class="spinner"></div>

<button
id="retryButton"
onclick="retryChannel()"
style="display:none">
🔄 إعادة المحاولة
</button>

</div>

</div>


<div class="playerControls">

<button class="pbtn"
onclick="previousChannel()">
⏮️ السابقة
</button>

<button class="pbtn"
onclick="nextChannel()">
⏭️ التالية
</button>

<button class="pbtn"
onclick="fullscreen()">
⛶ ملء الشاشة
</button>

<button class="pbtn homeBtn"
onclick="goHome()">
🏠 القائمة الرئيسية
</button>

</div>

</section>


<!-- HOME -->

<main id="home">

<div class="sectionTitle">
🌍 البلدان
</div>

<div id="countries" class="countries">
</div>

<div
id="countryTitle"
class="sectionTitle"
style="display:none">
📺 القنوات
</div>

<button
id="backCountries"
class="backCountries"
style="display:none"
onclick="showCountries()">
← رجوع للبلدان
</button>

<div
id="status"
class="status">
⏳ جاري تحميل القنوات...
</div>

<div id="grid" class="grid">
</div>

<button
id="more"
class="more"
style="display:none">
عرض 50 قناة أخرى
</button>

</main>


<script>

/* DATA */

const CHANNELS_URL =
"https://iptv-org.github.io/api/channels.json";

const STREAMS_URL =
"https://iptv-org.github.io/api/streams.json";

const BATCH=50;

let channels=[];
let streamMap=new Map();

let filtered=[];
let shown=0;

let currentIndex=0;
let currentChannel=null;

let currentCountry="all";

let hls=null;
let retryTimer=null;


/* COUNTRIES */

const COUNTRIES={

DZ:["🇩🇿","الجزائر"],
MA:["🇲🇦","المغرب"],
TN:["🇹🇳","تونس"],
EG:["🇪🇬","مصر"],
LY:["🇱🇾","ليبيا"],
MR:["🇲🇷","موريتانيا"],

SA:["🇸🇦","السعودية"],
AE:["🇦🇪","الإمارات"],
QA:["🇶🇦","قطر"],
KW:["🇰🇼","الكويت"],
BH:["🇧🇭","البحرين"],
OM:["🇴🇲","عُمان"],

JO:["🇯🇴","الأردن"],
LB:["🇱🇧","لبنان"],
IQ:["🇮🇶","العراق"],
SY:["🇸🇾","سوريا"],
PS:["🇵🇸","فلسطين"],

FR:["🇫🇷","فرنسا"],
GB:["🇬🇧","بريطانيا"],
DE:["🇩🇪","ألمانيا"],
IT:["🇮🇹","إيطاليا"],
ES:["🇪🇸","إسبانيا"],
PT:["🇵🇹","البرتغال"],
NL:["🇳🇱","هولندا"],
BE:["🇧🇪","بلجيكا"],
CH:["🇨🇭","سويسرا"],
AT:["🇦🇹","النمسا"],
IE:["🇮🇪","أيرلندا"],
SE:["🇸🇪","السويد"],
NO:["🇳🇴","النرويج"],
DK:["🇩🇰","الدنمارك"],
FI:["🇫🇮","فنلندا"],
GR:["🇬🇷","اليونان"],
TR:["🇹🇷","تركيا"],
RU:["🇷🇺","روسيا"],

US:["🇺🇸","أمريكا"],
CA:["🇨🇦","كندا"],
MX:["🇲🇽","المكسيك"],
BR:["🇧🇷","البرازيل"],
AR:["🇦🇷","الأرجنتين"],
CL:["🇨🇱","تشيلي"],
CO:["🇨🇴","كولومبيا"],

IN:["🇮🇳","الهند"],
JP:["🇯🇵","اليابان"],
KR:["🇰🇷","كوريا الجنوبية"],
CN:["🇨🇳","الصين"],
ID:["🇮🇩","إندونيسيا"],
MY:["🇲🇾","ماليزيا"],
TH:["🇹🇭","تايلاند"],
PH:["🇵🇭","الفلبين"],

AU:["🇦🇺","أستراليا"],
NZ:["🇳🇿","نيوزيلندا"],

ZA:["🇿🇦","جنوب أفريقيا"],
NG:["🇳🇬","نيجيريا"]

};


/* LOAD DATA */

async function load(){

try{

const [channelsResponse,streamsResponse]=
await Promise.all([

fetch(CHANNELS_URL),

fetch(STREAMS_URL)

]);


const channelData=
await channelsResponse.json();

const streamData=
await streamsResponse.json();


streamData.forEach(stream=>{

if(
stream.channel &&
stream.url &&
!streamMap.has(stream.channel)
){

streamMap.set(
stream.channel,
stream.url
);

}

});


channels=
channelData.filter(channel=>
streamMap.has(channel.id)
);


/* SORT */

channels.sort((a,b)=>
(a.name||"").localeCompare(
(b.name||"")
));


buildCountries();


document.getElementById(
"status"
).style.display="none";


/*
أول قناة تلقائيا
*/

filtered=channels.slice();

if(filtered.length){

setTimeout(()=>{

playChannel(
filtered[0],
0,
true
);

},1000);

}


}catch(error){

console.error(error);

document.getElementById(
"status"
).textContent=
"❌ تعذر تحميل القنوات. تحقق من الإنترنت.";

}

}


/* COUNTRIES */

function buildCountries(){

const box=
document.getElementById("countries");

box.innerHTML="";


const found=new Set();

channels.forEach(channel=>{

if(channel.country){

found.add(channel.country);

}

});


[...found]
.sort((a,b)=>{

const aa=
COUNTRIES[a]?.[1]||a;

const bb=
COUNTRIES[b]?.[1]||b;

return aa.localeCompare(bb);

})
.forEach(code=>{

const card=
document.createElement("div");

card.className="countryCard";


const info=
COUNTRIES[code];


card.innerHTML=`

<div class="countryFlag">
${info?info[0]:"🌐"}
</div>

<div class="countryName">
${info?info[1]:code}
</div>

`;


card.onclick=()=>
showCountry(code);


box.appendChild(card);

});

}


/* COUNTRY */

function showCountry(code){

currentCountry=code;

filtered=
channels.filter(channel=>
channel.country===code
);


shown=0;

document.getElementById(
"grid"
).innerHTML="";


document.getElementById(
"countries"
).style.display="none";


document.getElementById(
"countryTitle"
).style.display="block";


document.getElementById(
"backCountries"
).style.display="inline-block";


const info=COUNTRIES[code];


document.getElementById(
"countryTitle"
).textContent=
info
?
info[0]+" "+info[1]+" — القنوات"
:
"🌐 القنوات";


renderChannels();

}


/* SHOW COUNTRIES */

function showCountries(){

document.getElementById(
"countries"
).style.display="grid";


document.getElementById(
"countryTitle"
).style.display="none";


document.getElementById(
"backCountries"
).style.display="none";


document.getElementById(
"grid"
).innerHTML="";


document.getElementById(
"more"
).style.display="none";


filtered=channels;

}


/* SEARCH */

document.getElementById(
"search"
).oninput=function(){

const q=this.value
.toLowerCase()
.trim();


if(!q){

if(currentCountry==="all"){

showCountries();

}

return;

}


filtered=channels.filter(channel=>
(channel.name||"")
.toLowerCase()
.includes(q)
);


document.getElementById(
"countries"
).style.display="none";


document.getElementById(
"countryTitle"
).style.display="block";


document.getElementById(
"countryTitle"
).textContent=
"🔎 نتائج البحث";


document.getElementById(
"backCountries"
).style.display="inline-block";


shown=0;

document.getElementById(
"grid"
).innerHTML="";


renderChannels();

};


/* RENDER 50 */

function renderChannels(){

const grid=
document.getElementById("grid");

const end=
Math.min(
shown+BATCH,
filtered.length
);


for(
let i=shown;
i<end;
i++
){

createCard(
filtered[i],
grid
);

}


shown=end;


document.getElementById(
"more"
).style.display=
shown<filtered.length
?
"block"
:
"none";

}


/* CARD */

function createCard(channel,grid){

const card=
document.createElement("div");

card.className="card";


const logoBox=
document.createElement("div");

logoBox.className="logoBox";


const info=
COUNTRIES[channel.country];


const flag=
document.createElement("div");

flag.className="flag";

flag.textContent=
info
?
info[0]
:
"🌐";


logoBox.appendChild(flag);


if(channel.logo){

const img=
document.createElement("img");

img.src=channel.logo;

img.alt=
channel.name||"";

img.loading="lazy";


img.onerror=()=>{

img.remove();

const fallback=
document.createElement("div");

fallback.className="fallback";

fallback.textContent="📺";

logoBox.appendChild(
fallback
);

};


logoBox.appendChild(img);

}else{

logoBox.innerHTML+=
'<div class="fallback">📺</div>';

}


card.appendChild(logoBox);


const body=
document.createElement("div");

body.className="info";


body.innerHTML=`

<div class="name">
${channel.name||"قناة"}
</div>

<div class="country">
${info?info[0]+" "+info[1]:"🌐 دولية"}
</div>

`;


const button=
document.createElement("button");

button.className="watch";

button.textContent=
"▶ مشاهدة";


button.onclick=()=>{

const index=
channels.indexOf(channel);

playChannel(
channel,
index,
false
);

};


body.appendChild(button);

card.appendChild(body);

grid.appendChild(card);

}


/* PLAY CHANNEL */

function playChannel(
channel,
index,
auto=false
){

const url=
streamMap.get(channel.id);


if(!url){

showPlayerError(
"لا يوجد بث متاح لهذه القناة"
);

return;

}


currentChannel=channel;
currentIndex=index;


/*
إظهار المشغل
*/

document.getElementById(
"home"
).style.display="none";


document.getElementById(
"playerPage"
).style.display="block";


document.getElementById(
"channelName"
).textContent=
channel.name||"Live TV";


startStream(url,auto);


/*
أعلى الصفحة
*/

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* STREAM */

function startStream(url,auto=false){

clearTimeout(retryTimer);

hideError();

showLoading();


if(hls){

hls.destroy();

hls=null;

}


const video=
document.getElementById("video");


video.pause();

video.removeAttribute("src");

video.load();


/*
HLS
*/

if(
window.Hls &&
Hls.isSupported() &&
/\.m3u8/i.test(url)
){

hls=
new Hls({

enableWorker:true,

lowLatencyMode:false,

maxBufferLength:20,

maxMaxBufferLength:40,

backBufferLength:30,

manifestLoadingTimeOut:10000,

manifestLoadingMaxRetry:2,

levelLoadingMaxRetry:2,

fragLoadingMaxRetry:2

});


hls.loadSource(url);

hls.attachMedia(video);


hls.on(
Hls.Events.MANIFEST_PARSED,
()=>{

hideLoading();


/*
التشغيل التلقائي
*/

video.muted=auto;

video.play().catch(()=>{

if(auto){

showPlayerError(
"اضغط ▶ لتشغيل القناة"
);

}

});

});


hls.on(
Hls.Events.ERROR,
(event,data)=>{

if(!data.fatal)return;


if(
data.type===
Hls.ErrorTypes.MEDIA_ERROR
){

hls.recoverMediaError();

return;

}


if(
data.type===
Hls.ErrorTypes.NETWORK_ERROR
){

showLoading();


retryTimer=
setTimeout(()=>{

if(currentChannel){

const newUrl=
streamMap.get(
currentChannel.id
);

if(newUrl){

startStream(
newUrl,
false
);

}

}

},3000);


return;

}


showPlayerError(
"هذا المصدر غير قابل للتشغيل في المتصفح"
);

});

}else{

/*
تشغيل مباشر
*/

video.src=url;

video.load();

video.muted=auto;

video.play()
.then(()=>{

hideLoading();

})
.catch(()=>{

hideLoading();

showPlayerError(
"اضغط ▶ لتشغيل القناة"
);

});

}

}


/* NEXT */

function nextChannel(){

if(!channels.length)return;


/*
دائري
*/

currentIndex=
(currentIndex+1)
%channels.length;


const channel=
channels[currentIndex];


playChannel(
channel,
currentIndex,
false
);

}


/* PREVIOUS */

function previousChannel(){

if(!channels.length)return;


/*
دائري
*/

currentIndex=
(currentIndex-1+channels.length)
%channels.length;


const channel=
channels[currentIndex];


playChannel(
channel,
currentIndex,
false
);

}


/* HOME */

function goHome(){

clearTimeout(retryTimer);


if(hls){

hls.destroy();

hls=null;

}


const video=
document.getElementById("video");

video.pause();

video.removeAttribute("src");

video.load();


document.getElementById(
"playerPage"
).style.display="none";


document.getElementById(
"home"
).style.display="block";


window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* FULLSCREEN */

function fullscreen(){

const player=
document.querySelector(".player");


if(
document.fullscreenElement
){

document.exitFullscreen();

}else{

player.requestFullscreen?.();

}

}


/* LOADING */

function showLoading(){

const box=
document.getElementById("message");

box.style.display="flex";


document.getElementById(
"messageText"
).textContent=
"جاري الاتصال بالبث...";


document.getElementById(
"spinner"
).style.display="block";


document.getElementById(
"retryButton"
).style.display="none";

}


function hideLoading(){

document.getElementById(
"message"
).style.display="none";

}


/* ERROR */

function showPlayerError(text){

const box=
document.getElementById("message");

box.style.display="flex";


document.getElementById(
"messageText"
).textContent=
"⚠️ "+text;


document.getElementById(
"spinner"
).style.display="none";


document.getElementById(
"retryButton"
).style.display="block";

}


function hideError(){

document.getElementById(
"message"
).style.display="none";

}


/* RETRY */

function retryChannel(){

if(!currentChannel)return;

const url=
streamMap.get(
currentChannel.id
);

if(url){

startStream(
url,
false
);

}

}


/* MORE */

document.getElementById(
"more"
).onclick=
renderChannels;


/* START */

load();

</script>

</body>
 </html>
