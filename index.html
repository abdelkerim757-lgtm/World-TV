<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HAMOUDA TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

html,body{
  margin:0;
  background:#080a0f;
  color:#fff;
  font-family:Arial,Tahoma,sans-serif
}

button,input{
  font:inherit
}

button{
  cursor:pointer
}

/* HEADER */

header{
  height:64px;
  position:sticky;
  top:0;
  z-index:50;
  background:#0b0e13ee;
  backdrop-filter:blur(16px);
  border-bottom:1px solid #222731
}

.header{
  max-width:1400px;
  height:100%;
  margin:auto;
  padding:0 16px;
  display:flex;
  align-items:center;
  gap:16px
}

.logo{
  font-size:21px;
  font-weight:900;
  white-space:nowrap
}

.logo span{
  color:#e50914
}

.search{
  margin-right:auto;
  width:min(340px,48vw)
}

.search input{
  width:100%;
  border:1px solid #303640;
  background:#171a20;
  color:#fff;
  outline:none;
  padding:10px 16px;
  border-radius:24px
}

/* HOME */

main{
  max-width:1400px;
  margin:auto;
  padding:22px 15px 60px
}

.hero{
  padding:28px 5px 20px
}

.hero h1{
  margin:0;
  font-size:32px
}

.hero p{
  color:#858d99;
  margin:9px 0 0
}

.title{
  font-size:21px;
  font-weight:bold;
  margin:15px 0
}

.countries{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:12px
}

.country{
  min-height:120px;
  padding:17px 8px;
  border:1px solid #292e37;
  border-radius:13px;
  background:linear-gradient(145deg,#151920,#0e1116);
  color:#fff;
  transition:.18s;
}

.country:hover{
  transform:translateY(-3px);
  border-color:#e50914
}

.country .flag{
  font-size:39px
}

.country .name{
  margin-top:9px;
  font-weight:bold
}

.country .count{
  margin-top:5px;
  color:#737b87;
  font-size:12px
}

/* CHANNEL LIST */

.channelHeader{
  display:none;
  align-items:center;
  gap:10px;
  margin:20px 0
}

.backCountries{
  border:1px solid #303640;
  background:#171a20;
  color:#fff;
  padding:9px 15px;
  border-radius:8px
}

.channels{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:13px
}

.card{
  background:#13161c;
  border:1px solid #252a33;
  border-radius:12px;
  overflow:hidden
}

.cardLogo{
  height:115px;
  background:#090b0f;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center
}

.cardLogo img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:12px
}

.cardFlag{
  position:absolute;
  right:8px;
  top:7px;
  font-size:22px
}

.cardBody{
  padding:11px
}

.channelName{
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.watch{
  width:100%;
  margin-top:10px;
  padding:9px;
  border:0;
  border-radius:8px;
  background:#e50914;
  color:#fff
}

.more{
  display:block;
  margin:25px auto;
  border:1px solid #303640;
  background:#171a20;
  color:#fff;
  padding:11px 25px;
  border-radius:24px
}

/* PLAYER */

#player{
  display:none;
  background:#000
}

.playerBox{
  width:100%;
  max-width:1400px;
  margin:auto;
  background:#000;
  position:relative
}

video{
  width:100%;
  height:auto;
  max-height:78vh;
  min-height:230px;
  display:block;
  background:#000;
  object-fit:contain
}

.playerInfo{
  padding:11px 14px;
  background:#0d1015;
  display:flex;
  align-items:center;
  gap:9px
}

.live{
  background:#e50914;
  border-radius:5px;
  padding:4px 7px;
  font-size:10px
}

.nowName{
  font-weight:bold
}

/* CONTROLS */

.controls{
  max-width:1400px;
  margin:auto;
  background:#0d1015;
  display:flex;
  justify-content:center;
  gap:8px;
  padding:9px
}

.control{
  width:44px;
  height:40px;
  border:1px solid #303640;
  border-radius:8px;
  background:#181c22;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center
}

.control:hover{
  background:#e50914
}

/* MINI PLAYER */

.miniPlayer{
  display:none;
  position:fixed;
  z-index:100;
  left:12px;
  bottom:12px;
  width:280px;
  background:#080a0e;
  border:1px solid #303640;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 12px 40px #000b
}

.miniPlayer video{
  width:100%;
  height:155px;
  min-height:0;
  object-fit:contain
}

.miniBar{
  height:38px;
  padding:0 8px;
  display:flex;
  align-items:center;
  gap:8px
}

.miniBar span{
  font-size:12px;
  flex:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.miniClose{
  border:0;
  background:none;
  color:#fff;
  font-size:18px
}

/* LOADING */

.loading{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:#0008;
  z-index:5
}

.spinner{
  width:42px;
  height:42px;
  border:4px solid #444;
  border-top-color:#e50914;
  border-radius:50%;
  animation:spin .7s linear infinite
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* LANDSCAPE */

.landscape{
  display:none
}

@media(max-width:900px){

  .landscape{
    display:flex
  }

  .hero h1{
    font-size:26px
  }

  .countries{
    grid-template-columns:repeat(3,1fr);
    gap:8px
  }

  .country{
    min-height:105px
  }

  .country .flag{
    font-size:31px
  }

  .channels{
    grid-template-columns:repeat(2,1fr);
    gap:9px
  }

  .cardLogo{
    height:90px
  }

}

/*
Landscape:
الأزرار مخفية، وتظهر عند لمس الشاشة
*/

@media(max-width:900px) and (orientation:landscape){

  header{
    display:none
  }

  #player{
    position:fixed;
    inset:0;
    z-index:200;
    height:100vh;
    background:#000
  }

  .playerBox{
    width:100%;
    height:100%;
    max-width:none
  }

  video{
    width:100%;
    height:100%;
    max-height:none;
    min-height:0
  }

  .playerInfo{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:10;
    background:linear-gradient(#000c,transparent);
    padding:14px
  }

  .controls{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    z-index:20;
    background:linear-gradient(transparent,#000d);
    padding:22px 10px 12px;
    opacity:0;
    pointer-events:none;
    transition:.25s
  }

  #player.showControls .controls{
    opacity:1;
    pointer-events:auto
  }

  #player.showControls .playerInfo{
    opacity:1
  }

  .control{
    width:45px;
    height:42px;
    background:#151820dd
  }

  .miniPlayer{
    display:none!important
  }

}

/* DESKTOP */

@media(min-width:901px){

  .miniPlayer{
    display:none!important
  }

}

.status{
  text-align:center;
  color:#858d99;
  padding:30px
}
</style>
</head>

<body>

<header>
  <div class="header">

    <div class="logo">
      <span>HAMOUDA</span> TV
    </div>

    <div class="search">
      <input id="search" placeholder="ابحث عن قناة">
    </div>

  </div>
</header>


<!-- PLAYER -->

<section id="player">

  <div class="playerBox">

    <video
      id="video"
      controls
      playsinline
      preload="none">
    </video>

    <div class="loading" id="loading">
      <div class="spinner"></div>
    </div>

    <div class="playerInfo">
      <span class="live">LIVE</span>
      <span id="nowName" class="nowName">القناة</span>
    </div>

    <div class="controls">

      <button
        class="control"
        title="السابق"
        onclick="previousChannel()">
        ◀
      </button>

      <button
        class="control"
        title="التالي"
        onclick="nextChannel()">
        ▶
      </button>

      <button
        class="control landscape"
        title="Landscape"
        onclick="landscapeMode()">
        ⛶
      </button>

      <button
        class="control"
        title="ملء الشاشة"
        onclick="fullScreen()">
        ⛶
      </button>

      <button
        class="control"
        title="القائمة الرئيسية"
        onclick="backHome()">
        ⌂
      </button>

    </div>

  </div>

</section>


<!-- MINI PLAYER -->

<div id="miniPlayer" class="miniPlayer">

  <video
    id="miniVideo"
    muted
    playsinline>
  </video>

  <div class="miniBar">

    <span id="miniName">القناة</span>

    <button
      class="miniClose"
      onclick="closeMini()">
      ×
    </button>

  </div>

</div>


<!-- HOME -->

<main id="home">

  <div class="hero">
    <h1>عالم التلفزيون بين يديك</h1>
    <p>شاهد القنوات العالمية حسب البلد</p>
  </div>

  <div class="title">البلدان</div>

  <div id="countries" class="countries"></div>

  <div
    id="channelHeader"
    class="channelHeader">

    <button
      class="backCountries"
      onclick="showCountries()">
      رجوع للبلدان
    </button>

    <div id="countryTitle"></div>

  </div>

  <div
    id="channels"
    class="channels">
  </div>

  <div
    id="status"
    class="status">
    جاري تحميل القنوات...
  </div>

  <button
    id="more"
    class="more"
    style="display:none">
    عرض 50 قناة أخرى
  </button>

</main>


<script>

/* =========================
   DATA
========================= */

const CHANNELS_URL =
"https://iptv-org.github.io/api/channels.json";

const STREAMS_URL =
"https://iptv-org.github.io/api/streams.json";

const BATCH = 50;

let channels = [];
let streams = new Map();

let filtered = [];
let shown = 0;

let currentIndex = 0;
let currentChannel = null;

let hls = null;
let controlsTimer = null;


/* =========================
   COUNTRIES
========================= */

const countries = {

DZ:["🇩🇿","الجزائر"],
MA:["🇲🇦","المغرب"],
TN:["🇹🇳","تونس"],
EG:["🇪🇬","مصر"],
LY:["🇱🇾","ليبيا"],
MR:["🇲🇷","موريتانيا"],

SA:["🇸🇦","السعودية"],
AE:["🇦🇪","الإمارات"],
QA:["🇶🇦","قطر"],
KW:["🇰🇼","الكويت"],
BH:["🇧🇭","البحرين"],
OM:["🇴🇲","عُمان"],

JO:["🇯🇴","الأردن"],
LB:["🇱🇧","لبنان"],
IQ:["🇮🇶","العراق"],
SY:["🇸🇾","سوريا"],
PS:["🇵🇸","فلسطين"],

FR:["🇫🇷","فرنسا"],
GB:["🇬🇧","بريطانيا"],
DE:["🇩🇪","ألمانيا"],
IT:["🇮🇹","إيطاليا"],
ES:["🇪🇸","إسبانيا"],
PT:["🇵🇹","البرتغال"],
NL:["🇳🇱","هولندا"],
BE:["🇧🇪","بلجيكا"],
CH:["🇨🇭","سويسرا"],
AT:["🇦🇹","النمسا"],
IE:["🇮🇪","أيرلندا"],
SE:["🇸🇪","السويد"],
NO:["🇳🇴","النرويج"],
DK:["🇩🇰","الدنمارك"],
FI:["🇫🇮","فنلندا"],
GR:["🇬🇷","اليونان"],
TR:["🇹🇷","تركيا"],
RU:["🇷🇺","روسيا"],

US:["🇺🇸","أمريكا"],
CA:["🇨🇦","كندا"],
MX:["🇲🇽","المكسيك"],
BR:["🇧🇷","البرازيل"],
AR:["🇦🇷","الأرجنتين"],
CL:["🇨🇱","تشيلي"],
CO:["🇨🇴","كولومبيا"],

IN:["🇮🇳","الهند"],
JP:["🇯🇵","اليابان"],
KR:["🇰🇷","كوريا الجنوبية"],
CN:["🇨🇳","الصين"],
ID:["🇮🇩","إندونيسيا"],
MY:["🇲🇾","ماليزيا"],
TH:["🇹🇭","تايلاند"],
PH:["🇵🇭","الفلبين"],

AU:["🇦🇺","أستراليا"],
NZ:["🇳🇿","نيوزيلندا"],

ZA:["🇿🇦","جنوب أفريقيا"],
NG:["🇳🇬","نيجيريا"]

};


/* =========================
   LOAD
========================= */

async function loadData(){

  try{

    const [a,b] = await Promise.all([
      fetch(CHANNELS_URL),
      fetch(STREAMS_URL)
    ]);

    const channelData = await a.json();
    const streamData = await b.json();

    streamData.forEach(s=>{

      if(
        s.channel &&
        s.url &&
        !streams.has(s.channel)
      ){

        streams.set(s.channel,s.url);

      }

    });

    channels =
      channelData.filter(c =>
        streams.has(c.id)
      );

    channels.sort((a,b)=>
      (a.name||"").localeCompare(b.name||"")
    );

    buildCountries();

    document.getElementById("status").style.display="none";

    /*
      أول قناة
      لكن لا نفتح المشغل فوق القائمة مباشرة.
      نجهز أول قناة فقط.
    */

    if(channels.length){
      currentChannel=channels[0];
      currentIndex=0;
    }

  }catch(e){

    console.error(e);

    document.getElementById("status").textContent =
      "تعذر تحميل القنوات. تحقق من الاتصال بالإنترنت.";

  }

}


/* =========================
   COUNTRIES
========================= */

function buildCountries(){

  const box =
    document.getElementById("countries");

  box.innerHTML="";

  const found = new Set();

  channels.forEach(c=>{

    if(c.country){
      found.add(c.country);
    }

  });

  [...found]
    .sort((a,b)=>{

      const aa=countries[a]?.[1]||a;
      const bb=countries[b]?.[1]||b;

      return aa.localeCompare(bb);

    })
    .forEach(code=>{

      const info=countries[code];

      const count =
        channels.filter(c=>c.country===code).length;

      const card =
        document.createElement("button");

      card.className="country";

      card.innerHTML=`

        <div class="flag">
          ${info ? info[0] : "🌐"}
        </div>

        <div class="name">
          ${info ? info[1] : code}
        </div>

        <div class="count">
          ${count} قناة
        </div>

      `;

      card.onclick=()=>showCountry(code);

      box.appendChild(card);

    });

}


/* =========================
   COUNTRY
========================= */

function showCountry(code){

  filtered =
    channels.filter(c=>c.country===code);

  shown=0;

  document.getElementById("countries")
    .style.display="none";

  document.querySelector(".hero")
    .style.display="none";

  document.querySelector(".title")
    .style.display="none";

  document.getElementById("channelHeader")
    .style.display="flex";

  const info=countries[code];

  document.getElementById("countryTitle")
    .textContent =
      info
      ? info[0]+" "+info[1]
      : code;

  document.getElementById("channels")
    .innerHTML="";

  renderChannels();

}


/* =========================
   SHOW COUNTRIES
========================= */

function showCountries(){

  document.getElementById("countries")
    .style.display="grid";

  document.querySelector(".hero")
    .style.display="block";

  document.querySelector(".title")
    .style.display="block";

  document.getElementById("channelHeader")
    .style.display="none";

  document.getElementById("channels")
    .innerHTML="";

  document.getElementById("more")
    .style.display="none";

}


/* =========================
   CHANNELS
========================= */

function renderChannels(){

  const box =
    document.getElementById("channels");

  const end =
    Math.min(shown+BATCH,filtered.length);

  for(let i=shown;i<end;i++){

    const c=filtered[i];

    const card =
      document.createElement("div");

    card.className="card";

    const info=countries[c.country];

    const logo =
      c.logo
      ? `<img src="${c.logo}" loading="lazy"
           onerror="this.style.display='none'">`
      : `<span style="font-size:40px">TV</span>`;

    card.innerHTML=`

      <div class="cardLogo">

        <div class="cardFlag">
          ${info ? info[0] : "🌐"}
        </div>

        ${logo}

      </div>

      <div class="cardBody">

        <div class="channelName">
          ${c.name || "قناة"}
        </div>

        <button class="watch">
          مشاهدة
        </button>

      </div>

    `;

    card.querySelector(".watch")
      .onclick=()=>{

        const index=channels.indexOf(c);

        openChannel(c,index);

      };

    box.appendChild(card);

  }

  shown=end;

  document.getElementById("more")
    .style.display =
      shown<filtered.length
      ? "block"
      : "none";

}


/* =========================
   SEARCH
========================= */

document.getElementById("search")
.addEventListener("input",function(){

  const q=this.value.trim().toLowerCase();

  if(!q){

    showCountries();
    return;

  }

  filtered =
    channels.filter(c=>
      (c.name||"").toLowerCase().includes(q)
    );

  shown=0;

  document.getElementById("countries")
    .style.display="none";

  document.querySelector(".hero")
    .style.display="none";

  document.querySelector(".title")
    .style.display="none";

  document.getElementById("channelHeader")
    .style.display="flex";

  document.getElementById("countryTitle")
    .textContent="نتائج البحث";

  document.getElementById("channels")
    .innerHTML="";

  renderChannels();

});


/* =========================
   OPEN CHANNEL
========================= */

function openChannel(channel,index){

  currentChannel=channel;
  currentIndex=index;

  document.getElementById("player")
    .style.display="block";

  document.getElementById("nowName")
    .textContent=channel.name||"القناة";

  startStream(
    streams.get(channel.id)
  );

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   STREAM
========================= */

function startStream(url){

  const video =
    document.getElementById("video");

  showLoading();

  if(hls){

    hls.destroy();
    hls=null;

  }

  video.pause();
  video.removeAttribute("src");
  video.load();

  if(
    window.Hls &&
    Hls.isSupported() &&
    /\.m3u8($|\?)/i.test(url)
  ){

    hls=new Hls({

      enableWorker:true,

      maxBufferLength:20,

      maxMaxBufferLength:40,

      backBufferLength:20

    });

    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(
      Hls.Events.MANIFEST_PARSED,
      ()=>{

        hideLoading();

        video.play().catch(()=>{});

      }
    );

    hls.on(
      Hls.Events.ERROR,
      (event,data)=>{

        if(data.fatal){

          hideLoading();

        }

      }
    );

  }else{

    video.src=url;

    video.load();

    video.play()
      .then(hideLoading)
      .catch(hideLoading);

  }

}


/* =========================
   NEXT / PREVIOUS
========================= */

function nextChannel(){

  if(!channels.length)return;

  currentIndex =
    (currentIndex+1)%channels.length;

  openChannel(
    channels[currentIndex],
    currentIndex
  );

}


function previousChannel(){

  if(!channels.length)return;

  currentIndex =
    (currentIndex-1+channels.length)
    %channels.length;

  openChannel(
    channels[currentIndex],
    currentIndex
  );

}


/* =========================
   BACK HOME
========================= */

function backHome(){

  /*
    الفيديو يبقى شغال.
    نخفي المشغل الكبير ونضع
    نسخة مصغرة.
  */

  const video =
    document.getElementById("video");

  const mini =
    document.getElementById("miniVideo");

  const miniBox =
    document.getElementById("miniPlayer");

  try{

    mini.src=video.currentSrc||video.src;
    mini.currentTime=video.currentTime;
    mini.play().catch(()=>{});

  }catch(e){}

  miniBox.style.display="block";

  document.getElementById("player")
    .style.display="none";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function closeMini(){

  const mini =
    document.getElementById("miniVideo");

  mini.pause();

  document.getElementById("miniPlayer")
    .style.display="none";

}


/* =========================
   LANDSCAPE
========================= */

function landscapeMode(){

  const player =
    document.getElementById("player");

  if(player.requestFullscreen){

    player.requestFullscreen()
      .then(()=>{

        if(screen.orientation &&
           screen.orientation.lock){

          screen.orientation
            .lock("landscape")
            .catch(()=>{});

        }

      })
      .catch(()=>{});

  }

}


/* =========================
   FULLSCREEN
========================= */

function fullScreen(){

  const player =
    document.querySelector(".playerBox");

  if(document.fullscreenElement){

    document.exitFullscreen();

  }else{

    player.requestFullscreen?.();

  }

}


/* =========================
   LANDSCAPE TOUCH CONTROLS
========================= */

document.getElementById("player")
.addEventListener("click",function(e){

  /*
    لا نفتح الأدوات إذا ضغط المستخدم
    على أزرار التحكم نفسها.
  */

  if(e.target.closest(".control"))return;

  if(
    !window.matchMedia(
      "(orientation: landscape)"
    ).matches
  )return;

  this.classList.add("showControls");

  clearTimeout(controlsTimer);

  controlsTimer =
    setTimeout(()=>{

      this.classList.remove("showControls");

    },3000);

});


/* =========================
   LOADING
========================= */

function showLoading(){

  document.getElementById("loading")
    .style.display="flex";

}

function hideLoading(){

  document.getElementById("loading")
    .style.display="none";

}


/* =========================
   MORE
========================= */

document.getElementById("more")
  .onclick=renderChannels;


/* =========================
   START
========================= */

loadData();

</script>
