<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hamouda TV Pro</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;background:#080a0f;color:#fff;font-family:Arial,Tahoma,sans-serif}
body{min-height:100vh}

header{
position:sticky;top:0;z-index:100;
background:rgba(8,10,15,.96);
backdrop-filter:blur(14px);
border-bottom:1px solid #252a34
}

.nav{
max-width:1450px;margin:auto;min-height:64px;
display:flex;align-items:center;gap:16px;padding:10px 18px
}

.logo{font-size:23px;font-weight:900;white-space:nowrap}
.logo b{color:#e50914}

.search{margin-right:auto;width:min(330px,42vw)}
.search input{
width:100%;padding:11px 15px;border-radius:25px;
border:1px solid #303642;background:#171a21;color:white;outline:0
}

.hero{
max-width:1450px;margin:auto;
background:#000
}

.player{
width:100%;aspect-ratio:16/9;max-height:70vh;
background:#000;position:relative
}

video{width:100%;height:100%;object-fit:contain;background:#000}

.playerTitle{
position:absolute;bottom:0;right:0;left:0;
padding:55px 22px 18px;
background:linear-gradient(transparent,#000d);
pointer-events:none
}

.live{
display:inline-block;background:#e50914;
padding:5px 9px;border-radius:5px;font-size:11px;font-weight:bold
}

.now{font-size:22px;font-weight:bold;margin-top:8px}

.main{max-width:1450px;margin:auto;padding:20px 16px 60px}

.heading{
display:flex;justify-content:space-between;align-items:center;
margin:22px 0 12px
}

.heading h2{font-size:20px;margin:0}
.count{color:#777;font-size:12px}

.categories,.countries{
display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;
scrollbar-width:none
}

.categories::-webkit-scrollbar,
.countries::-webkit-scrollbar{display:none}

.filter{
flex:0 0 auto;border:1px solid #303642;
background:#171a21;color:#ddd;
padding:10px 15px;border-radius:22px;cursor:pointer
}

.filter.active{background:#e50914;border-color:#e50914}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:13px
}

.card{
background:#14171e;border:1px solid #252a34;
border-radius:10px;overflow:hidden;cursor:pointer;
transition:.18s
}

.card:hover{transform:translateY(-2px);border-color:#555}

.logoBox{
height:105px;background:#0c0e13;
display:flex;align-items:center;justify-content:center;padding:14px
}

.logoBox img{width:100%;height:100%;object-fit:contain}
.noLogo{font-size:38px}

.body{padding:10px}

.name{
font-weight:bold;font-size:14px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}

.meta{font-size:11px;color:#777;margin-top:5px}

.watch{
width:100%;border:0;border-radius:7px;
padding:9px;margin-top:9px;
background:#252a33;color:#fff;cursor:pointer
}

.watch:hover{background:#e50914}

.more{
display:block;margin:25px auto 0;
padding:12px 30px;border:1px solid #343a46;
border-radius:24px;background:#181b22;color:white;
cursor:pointer;font-weight:bold
}

.status{text-align:center;color:#8b929e;padding:30px}

.empty{text-align:center;color:#777;padding:40px}

footer{text-align:center;color:#555;padding:30px;font-size:12px}

@media(max-width:650px){
.nav{min-height:57px;padding:8px 10px}
.logo{font-size:19px}
.search{width:150px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.logoBox{height:88px}
.main{padding:14px 10px 40px}
.now{font-size:17px}
}

@media(orientation:landscape) and (max-height:600px){
.player{height:calc(100vh - 57px);max-height:none;aspect-ratio:auto}
}
</style>
</head>

<body>

<header>
<div class="nav">

<div class="logo">
<b>HAMOUDA</b> TV PRO 📺
</div>

<div class="search">
<input id="search" type="search" placeholder="🔎 ابحث عن قناة">
</div>

</div>
</header>

<section class="hero">
<div class="player">

<video id="video" controls autoplay muted playsinline></video>

<div class="playerTitle">
<div class="live">● مباشر</div>
<div class="now" id="now">اختر قناة للمشاهدة</div>
</div>

</div>
</section>

<main class="main">

<div class="heading">
<h2>🌍 التصنيفات</h2>
</div>

<div id="categories" class="categories"></div>

<div class="heading">
<h2>🌐 الدول</h2>
<div id="count" class="count"></div>
</div>

<div id="countries" class="countries"></div>

<div id="status" class="status">
⏳ جاري تجهيز القنوات...
</div>

<div id="grid" class="grid"></div>

<button id="more" class="more" style="display:none">
عرض 50 قناة أخرى
</button>

</main>

<footer>
HAMOUDA TV PRO 📺<br>
World Television
</footer>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>

const API_CHANNELS =
"https://iptv-org.github.io/api/channels.json";

const API_STREAMS =
"https://iptv-org.github.io/api/streams.json";

const BATCH=50;

let channels=[];
let streams=new Map();

let filtered=[];
let shown=0;

let selectedCategory="all";
let selectedCountry="all";

const video=document.getElementById("video");


/* أسماء الدول */

const countryNames={
DZ:"🇩🇿 الجزائر",
EG:"🇪🇬 مصر",
MA:"🇲🇦 المغرب",
TN:"🇹🇳 تونس",
SA:"🇸🇦 السعودية",
AE:"🇦🇪 الإمارات",
QA:"🇶🇦 قطر",
KW:"🇰🇼 الكويت",
JO:"🇯🇴 الأردن",
LB:"🇱🇧 لبنان",
IQ:"🇮🇶 العراق",
SY:"🇸🇾 سوريا",
PS:"🇵🇸 فلسطين",
FR:"🇫🇷 فرنسا",
GB:"🇬🇧 بريطانيا",
DE:"🇩🇪 ألمانيا",
IT:"🇮🇹 إيطاليا",
ES:"🇪🇸 إسبانيا",
PT:"🇵🇹 البرتغال",
NL:"🇳🇱 هولندا",
BE:"🇧🇪 بلجيكا",
CH:"🇨🇭 سويسرا",
AT:"🇦🇹 النمسا",
US:"🇺🇸 الولايات المتحدة",
CA:"🇨🇦 كندا",
MX:"🇲🇽 المكسيك",
BR:"🇧🇷 البرازيل",
AR:"🇦🇷 الأرجنتين",
TR:"🇹🇷 تركيا",
IN:"🇮🇳 الهند",
JP:"🇯🇵 اليابان",
KR:"🇰🇷 كوريا الجنوبية",
CN:"🇨🇳 الصين",
AU:"🇦🇺 أستراليا",
ZA:"🇿🇦 جنوب أفريقيا",
NG:"🇳🇬 نيجيريا",
RU:"🇷🇺 روسيا"
};


/* تصنيفات عامة */

const europe=[
"FR","GB","DE","IT","ES","PT","NL","BE",
"CH","AT","TR","RU"
];

const arab=[
"DZ","EG","MA","TN","SA","AE","QA","KW",
"JO","LB","IQ","SY","PS"
];

const america=[
"US","CA","MX","BR","AR"
];

const asia=[
"IN","JP","KR","CN","AU"
];


async function load(){

try{

const [a,b]=await Promise.all([
fetch(API_CHANNELS),
fetch(API_STREAMS)
]);

const channelData=await a.json();
const streamData=await b.json();


streamData.forEach(s=>{

if(s.channel && s.url && !streams.has(s.channel)){
streams.set(s.channel,s.url);
}

});


channels=channelData.filter(c=>
streams.has(c.id)
);


/*
نخلي القنوات اللي عندها بث فعلي فقط
*/

buildCategories();
buildCountries();

applyFilters();

document.getElementById("status").style.display="none";


}catch(e){

console.error(e);

document.getElementById("status").innerHTML=
"❌ تعذر تحميل القنوات.<br>تحقق من الإنترنت وأعد المحاولة.";

}

}


/* التصنيفات */

function buildCategories(){

const box=document.getElementById("categories");

box.innerHTML="";

addCategory(box,"all","🌍 العالم");

addCategory(box,"arab","🕌 عربي");

addCategory(box,"europe","🇪🇺 أوروبا");

addCategory(box,"america","🌎 أمريكا");

addCategory(box,"asia","🌏 آسيا");

}


/* زر تصنيف */

function addCategory(box,id,text){

const b=document.createElement("button");

b.className="filter";

if(id==="all")b.classList.add("active");

b.textContent=text;

b.onclick=()=>{

document.querySelectorAll("#categories .filter")
.forEach(x=>x.classList.remove("active"));

b.classList.add("active");

selectedCategory=id;

selectedCountry="all";

document.querySelectorAll("#countries .filter")
.forEach(x=>x.classList.remove("active"));

document.querySelector("#countries .filter")
?.classList.add("active");

applyFilters();

};

box.appendChild(b);

}


/* الدول */

function buildCountries(){

const box=document.getElementById("countries");

box.innerHTML="";

const all=document.createElement("button");

all.className="filter active";

all.textContent="🌍 الكل";

all.onclick=()=>{

selectedCountry="all";

document.querySelectorAll("#countries .filter")
.forEach(x=>x.classList.remove("active"));

all.classList.add("active");

applyFilters();

};

box.appendChild(all);


const set=new Set();

channels.forEach(c=>{

if(Array.isArray(c.countries)){

c.countries.forEach(x=>set.add(x));

}

});


Array.from(set)
.sort()
.forEach(code=>{

const b=document.createElement("button");

b.className="filter";

b.textContent=
countryNames[code] || ("🌐 "+code);

b.onclick=()=>{

selectedCountry=code;

document.querySelectorAll("#countries .filter")
.forEach(x=>x.classList.remove("active"));

b.classList.add("active");

applyFilters();

};

box.appendChild(b);

});

}


/* التصفية */

function applyFilters(){

const search=
document.getElementById("search")
.value.toLowerCase().trim();


filtered=channels.filter(c=>{

const name=(c.name||"").toLowerCase();

if(search && !name.includes(search))
return false;


if(selectedCountry!=="all"){

if(
!Array.isArray(c.countries) ||
!c.countries.includes(selectedCountry)
)return false;

}


if(selectedCategory!=="all"){

const countries=c.countries||[];

if(selectedCategory==="arab" &&
!countries.some(x=>arab.includes(x)))
return false;

if(selectedCategory==="europe" &&
!countries.some(x=>europe.includes(x)))
return false;

if(selectedCategory==="america" &&
!countries.some(x=>america.includes(x)))
return false;

if(selectedCategory==="asia" &&
!countries.some(x=>asia.includes(x)))
return false;

}


return true;

});


filtered.sort((a,b)=>
(a.name||"").localeCompare(b.name||"")
);


shown=0;

document.getElementById("grid").innerHTML="";

renderNext();

}


/* تحميل 50 فقط */

function renderNext(){

const grid=document.getElementById("grid");

const next=
Math.min(
shown+BATCH,
filtered.length
);


for(let i=shown;i<next;i++){

createCard(filtered[i],grid);

}


shown=next;


document.getElementById("count").textContent=
filtered.length+" قناة";


const more=document.getElementById("more");

more.style.display=
shown<filtered.length
?"block":"none";

}


/* بطاقة */

function createCard(c,grid){

const card=document.createElement("div");

card.className="card";


const logo=document.createElement("div");

logo.className="logoBox";


if(c.logo){

const img=document.createElement("img");

img.src=c.logo;

img.loading="lazy";

img.alt=c.name||"";

img.onerror=()=>{
img.remove();
logo.innerHTML='<div class="noLogo">📺</div>';
};

logo.appendChild(img);

}else{

logo.innerHTML='<div class="noLogo">📺</div>';

}

card.appendChild(logo);


const body=document.createElement("div");

body.className="body";


const name=document.createElement("div");

name.className="name";

name.textContent=c.name||"Channel";

body.appendChild(name);


const code=
(c.countries&&c.countries[0])||"";

const meta=document.createElement("div");

meta.className="meta";

meta.textContent=
countryNames[code]||"🌍 دولية";

body.appendChild(meta);


const btn=document.createElement("button");

btn.className="watch";

btn.textContent="▶ مشاهدة";

btn.onclick=()=>play(c);

body.appendChild(btn);

card.appendChild(body);

grid.appendChild(card);

}


/* التشغيل */

function play(channel){

const url=streams.get(channel.id);

if(!url)return;


document.getElementById("now").textContent=
channel.name||"Live";


if(window.hlsPlayer){

window.hlsPlayer.destroy();

window.hlsPlayer=null;

}


if(
window.Hls &&
Hls.isSupported() &&
/m3u8/i.test(url)
){

const hls=new Hls({
enableWorker:true,
lowLatencyMode:false,
maxBufferLength:20,
maxMaxBufferLength:30
});

window.hlsPlayer=hls;

hls.loadSource(url);

hls.attachMedia(video);

hls.on(
Hls.Events.MANIFEST_PARSED,
()=>{
video.play().catch(()=>{});
}
);

}else{

video.src=url;

video.play().catch(()=>{});

}


window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* المزيد */

document.getElementById("more")
.onclick=renderNext;


/* البحث */

document.getElementById("search")
.oninput=applyFilters;


/* تشغيل */

load();

</script>

</body>
  </html>
